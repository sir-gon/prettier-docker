name: Build and Push Docker image

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY }}


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_url: ${{ steps.publish.outputs.image_url }}
      tag_url: ${{ steps.publish.outputs.tag_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (local, load)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}

      - name: Get prettier version
        id: prettier
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # Si la imagen ya tiene `prettier` como ENTRYPOINT, pasar --version como argumento.
          OUT=$(docker run --rm ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }} --version 2>/dev/null || true)
          V=$(echo "$OUT" | grep -oE '[0-9]+(\.[0-9]+){1,}' || true)
          if [ -z "$V" ]; then
            echo "No se pudo detectar la versión de prettier. Usando SHORT_SHA como versión fallback."
            V=${{ env.SHORT_SHA }}
          fi
          echo "PRETTIER_VERSION=$V" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image with version
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }} ${{ env.IMAGE_NAME }}:${{ env.PRETTIER_VERSION }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ env.PRETTIER_VERSION }}
          docker push ${{ env.IMAGE_NAME }}:latest
        env:
          PRETTIER_VERSION: ${{ env.PRETTIER_VERSION }}

      - name: Publish Docker Hub URL
        id: publish
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          REPO_URL="https://hub.docker.com/r/${{ env.IMAGE_NAME }}"
          TAG_URL="${REPO_URL}/tags?name=${{ env.PRETTIER_VERSION }}"
          echo "image_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"
          echo "### Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: $REPO_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: $TAG_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with Docker Hub link
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v6
        with:
          script: |
            const commit = process.env.GITHUB_SHA;
            const repoName = process.env.IMAGE_NAME;
            const repoUrl = `https://hub.docker.com/r/${repoName}`;
            const tagUrl = `${repoUrl}/tags?name=${process.env.PRETTIER_VERSION}`;
            const res = await github.request('GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commit,
              mediaType: { previews: ['groot'] }
            });
            if (res.data && res.data.length > 0) {
              const prNumber = res.data[0].number;
              const body = `La imagen Docker se ha publicado:\n- Repositorio: ${repoUrl}\n- Tag: ${tagUrl}`;
              await github.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body });
              core.info(`Commented on PR #${prNumber}`);
            } else {
              core.info('No pull request found for this commit.');
            }
        env:
          PRETTIER_VERSION: ${{ env.PRETTIER_VERSION }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SHORT_SHA: ${{ env.SHORT_SHA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

