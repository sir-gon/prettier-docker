name: Build and Push Docker image

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY }}

jobs:
  build:
    runs-on: ubuntu-26.04
    outputs:
      short_sha: ${{ steps.short_sha.outputs.short_sha }}
      prettier_version: ${{ steps.prettier.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set short SHA
        id: short_sha
        run: echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (local, load)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.short_sha.outputs.short_sha }}

      - name: Get prettier version
        id: prettier
        run: |
          set -euo pipefail
          OUT=$(docker run --rm "${{ env.IMAGE_NAME }}:${{ steps.short_sha.outputs.short_sha }}" --version 2>/dev/null || true)
          V=$(echo "$OUT" | grep -oE '[0-9]+(\.[0-9]+){1,}' || true)
          if [ -z "$V" ]; then
            echo "No se pudo detectar la versión de prettier. Usando SHORT_SHA como versión fallback."
            V="${{ steps.short_sha.outputs.short_sha }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Save image artifact
        run: docker save "${{ env.IMAGE_NAME }}:${{ steps.short_sha.outputs.short_sha }}" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar

  push:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    env:
      SHORT_SHA: ${{ needs.build.outputs.short_sha }}
      PRETTIER_VERSION: ${{ needs.build.outputs.prettier_version }}
    steps:
      - name: Download built image
        uses: actions/download-artifact@v7
        with:
          name: docker-image

      - name: Load image
        run: docker load --input image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image with version
        run: |
          docker tag "${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}" "${{ env.IMAGE_NAME }}:${{ env.PRETTIER_VERSION }}"
          docker tag "${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}" "${{ env.IMAGE_NAME }}:latest"
          docker push "${{ env.IMAGE_NAME }}:${{ env.PRETTIER_VERSION }}"
          docker push "${{ env.IMAGE_NAME }}:latest"

      - name: Publish Docker Hub URL
        id: publish
        run: |
          set -euo pipefail
          REPO_URL="https://hub.docker.com/r/${{ env.IMAGE_NAME }}"
          TAG_URL="${REPO_URL}/tags?name=${{ env.PRETTIER_VERSION }}"
          SUMMARY=$(cat <<EOF
          ### Docker Hub
          - Repository: $REPO_URL
          - Tag: $TAG_URL
          EOF
          )
          echo "image_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"